<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account — LASTGAZE</title>
  <meta name="description" content="Sign in to your LASTGAZE account to view your orders and manage saved addresses.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#fff">
  <link rel="icon" href="/assets/lastgaze-mark.svg">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="paper pg">

  <header class="pg-header">
    <div class="pg-header-left">
      <a href="/shop/" class="pg-close" aria-label="Back to shop">×</a>
      <span class="pg-header-email" id="account-email" style="display:none"></span>
    </div>
    <a href="/" class="pg-brand" aria-label="LASTGAZE home">
      <img src="/brand/lastgaze-wordmark-black.svg" alt="LASTGAZE">
    </a>
    <div class="pg-header-right">
      <button type="button" class="pg-link-btn" id="signout-btn" style="display:none">Sign Out</button>
    </div>
  </header>

  <main class="pg-main">

    <div id="auth-view">
      <h1 class="pg-h1">Account</h1>

      <div class="pg-tabs">
        <button type="button" class="pg-tab is-active" data-tab="signin">Sign In</button>
        <button type="button" class="pg-tab" data-tab="signup">Create Account</button>
      </div>

      <form class="pg-fieldset" id="signin-form" novalidate>
        <div class="pg-field">
          <label class="pg-label" for="signin-email">Email</label>
          <input class="pg-input" type="email" id="signin-email" required autocomplete="email">
        </div>
        <div class="pg-field">
          <label class="pg-label" for="signin-password">Password</label>
          <input class="pg-input" type="password" id="signin-password" required autocomplete="current-password">
        </div>
        <button class="pg-btn" type="submit">Sign In</button>
        <p class="pg-form-msg" id="signin-msg" role="status" aria-live="polite"></p>
      </form>

      <form class="pg-fieldset" id="signup-account-form" novalidate style="display:none">
        <div class="pg-field">
          <label class="pg-label" for="signup-name">Full name</label>
          <input class="pg-input" type="text" id="signup-name" required autocomplete="name">
        </div>
        <div class="pg-field">
          <label class="pg-label" for="signup-account-email">Email</label>
          <input class="pg-input" type="email" id="signup-account-email" required autocomplete="email">
        </div>
        <div class="pg-field">
          <label class="pg-label" for="signup-account-password">Password (min. 8 characters)</label>
          <input class="pg-input" type="password" id="signup-account-password" required minlength="8" autocomplete="new-password">
        </div>
        <button class="pg-btn" type="submit">Create Account</button>
        <p class="pg-form-msg" id="signup-account-msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <div id="account-view" style="display:none">

      <div class="pg-tabs">
        <button type="button" class="pg-tab is-active" data-account-tab="orders">Orders</button>
        <button type="button" class="pg-tab" data-account-tab="addresses">Addresses</button>
      </div>

      <div id="orders-panel">
        <div id="orders-list"></div>
      </div>

      <div id="addresses-panel" style="display:none">
        <div class="pg-address-list" id="address-list"></div>

        <div style="text-align:center;margin-bottom:40px;">
          <button class="pg-btn pg-btn--ghost" type="button" id="add-address-btn" style="max-width:260px;margin:0 auto;">Add Address</button>
        </div>

        <form class="pg-fieldset" id="address-form" novalidate style="display:none">
          <input type="hidden" id="address-id">
          <div class="pg-field">
            <label class="pg-label" for="address-label">Label (e.g. Home)</label>
            <input class="pg-input" type="text" id="address-label">
          </div>
          <div class="pg-field">
            <label class="pg-label" for="address-full-name">Full name</label>
            <input class="pg-input" type="text" id="address-full-name" required>
          </div>
          <div class="pg-field">
            <label class="pg-label" for="address-line1">Address line 1</label>
            <input class="pg-input" type="text" id="address-line1" required>
          </div>
          <div class="pg-field">
            <label class="pg-label" for="address-line2">Address line 2</label>
            <input class="pg-input" type="text" id="address-line2">
          </div>
          <div class="pg-row2">
            <div class="pg-field">
              <label class="pg-label" for="address-city">City</label>
              <input class="pg-input" type="text" id="address-city" required>
            </div>
            <div class="pg-field">
              <label class="pg-label" for="address-state">State</label>
              <input class="pg-input" type="text" id="address-state" required>
            </div>
          </div>
          <div class="pg-row2">
            <div class="pg-field">
              <label class="pg-label" for="address-postal">Postal code</label>
              <input class="pg-input" type="text" id="address-postal" required>
            </div>
            <div class="pg-field">
              <label class="pg-label" for="address-phone">Phone</label>
              <input class="pg-input" type="tel" id="address-phone">
            </div>
          </div>
          <div class="pg-field">
            <label style="display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;color:rgba(5,5,5,.6);">
              <input type="checkbox" id="address-default"> Set as default address
            </label>
          </div>
          <button class="pg-btn" type="submit">Save Address</button>
          <button class="pg-btn pg-btn--ghost" type="button" id="address-cancel" style="margin-top:10px;">Cancel</button>
          <p class="pg-form-msg" id="address-msg" role="status" aria-live="polite"></p>
        </form>
      </div>

    </div>

  </main>

  <style>
    /* This page overrides css/pages.css's dark theme with a white
       surface — scoped here only, since css/pages.css itself still
       defaults dark (other pages using it without an override, if
       any get added later, keep the dark theme). */
    body.pg { background: #fff; }
    .pg-header { background: #fff; border-bottom: 1px solid rgba(5,5,5,.08); }
    .pg-close { color: #050505; }
    .pg-header-email { color: rgba(5,5,5,.55); }
    .pg-header-right { color: rgba(5,5,5,.5); }
    .pg-h1, .pg-h2 { color: #050505; }
    .pg-p { color: rgba(5,5,5,.72); }
    .pg-p strong, .pg-p b { color: #050505; }
    .pg-p a { color: rgba(5,5,5,.8); }
    .pg-lead { color: rgba(5,5,5,.62); }
    .pg-rule { border-top: 1px solid rgba(5,5,5,.1); }
    .pg-updated { color: rgba(5,5,5,.28); }
    .pg-tab { border: 1px solid rgba(5,5,5,.2); color: rgba(5,5,5,.55); }
    .pg-tab.is-active { border-color: #050505; color: #050505; }
    .pg-label { color: rgba(5,5,5,.4); }
    .pg-input { border-bottom: 1px solid rgba(5,5,5,.28); color: #050505; caret-color: #050505; }
    .pg-input:focus { border-color: rgba(5,5,5,.75); }
    .pg-input::placeholder { color: rgba(5,5,5,.25); }
    .pg-btn { background: #050505; color: #fff; }
    .pg-btn--ghost { background: transparent; border: 1px solid rgba(5,5,5,.28); color: #050505; }
    .pg-link-btn { color: rgba(5,5,5,.5); }
    .pg-link-btn:hover { color: #050505; }
    .pg-address-card { border: 1px solid rgba(5,5,5,.14); }
    .pg-address-card__label { color: rgba(5,5,5,.4); }
    .pg-address-card__default { color: #050505; border: 1px solid rgba(5,5,5,.35); }
    .pg-address-card__body { color: rgba(5,5,5,.75); }
    .pg-form-msg { color: rgba(5,5,5,.38); }

    .ord-card { display: block; border: 1px solid rgba(5,5,5,.14); padding: 18px 20px; margin-bottom: 14px; cursor: pointer; transition: border-color .15s; }
    .ord-card:hover { border-color: rgba(5,5,5,.35); }
    .ord-card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
    .ord-date { font-family: var(--util); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(5,5,5,.4); }
    .ord-ref { font-family: var(--util); font-size: 9px; letter-spacing: .08em; color: rgba(5,5,5,.3); }
    .ord-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .ord-item-frame { width: 44px; height: 56px; background: rgba(5,5,5,.06); overflow: hidden; flex-shrink: 0; }
    .ord-item-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ord-item-name { font-family: var(--body); font-size: 13px; color: #050505; }
    .ord-item-meta { font-family: var(--util); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: rgba(5,5,5,.4); }
    .ord-total { font-family: var(--util); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(5,5,5,.5); padding-top: 12px; margin-top: 6px; border-top: 1px solid rgba(5,5,5,.1); display: flex; justify-content: space-between; }
    .ord-total strong { color: #050505; font-family: var(--body); font-size: 14px; letter-spacing: normal; text-transform: none; }
  </style>

  <script src="/assets/products.js"></script>
  <script src="/assets/account.js"></script>

</body>
</html>
