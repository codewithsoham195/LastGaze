<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private preview — LASTGAZE</title>
<meta name="description" content="LASTGAZE is a private vintage menswear archive from New Delhi.">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/assets/lastgaze-mark.svg">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="ink launch">
<video class="launch-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
  <source src="/assets/video/nebula-launch.mp4" type="video/mp4">
</video>
<main class="launch-shell">
  <section class="launch-main" aria-labelledby="launch-title">
    <div class="launch-intro">
      <img class="launch-wordmark" src="/assets/lastgaze-wordmark.svg" alt="LASTGAZE">
      <h1 id="launch-title">Archive access<br>opens soon.</h1>
    </div>

    <div class="launch-access">
      <div class="launch-access-copy">
        <span class="lab dim">Private access</span>
        <p>Enter your private code to view the archive.</p>
      </div>
      <form class="pw" data-lock>
        <label class="sr-only" for="access-code">Access code</label>
        <input id="access-code" type="password" placeholder="Access code" aria-describedby="lock-status" autocomplete="current-password" spellcheck="false" required>
        <button type="submit">Enter</button>
      </form>
    </div>
  </section>

  <footer class="launch-foot lab dim">
    <span>© 2026 Lastgaze</span>
    <a href="https://www.instagram.com/l4stgaze/" target="_blank" rel="noopener">Instagram ↗</a>
    <a href="mailto:l4stgaze@gmail.com">l4stgaze@gmail.com</a>
  </footer>
</main>

<script src="/assets/products.js"></script>
<script src="/assets/site.js"></script>
</body>
</html>
