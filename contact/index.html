<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — LASTGAZE</title>
  <meta name="description" content="Get in touch with LASTGAZE — order help, sizing, press, or general questions.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://lastgaze.com/contact/">
  <meta name="theme-color" content="#fff">
  <link rel="icon" href="/assets/lastgaze-mark.svg">
  <script>try{if(sessionStorage.getItem('lg_open')!=='1')location.replace('/password/')}catch(e){location.replace('/password/')}</script>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    /* This page overrides css/pages.css's dark theme with a white
       surface — scoped here only, since css/pages.css itself still
       defaults dark (other pages using it without an override, if
       any get added later, keep the dark theme). */
    body.pg { background: #fff; }
    .pg-header { background: #fff; border-bottom: 1px solid rgba(5,5,5,.08); }
    .pg-close { color: #050505; }
    .pg-h1 { color: #050505; }
    .pg-lead { color: rgba(5,5,5,.62); }

    .contact-form {
      max-width: 560px;
      margin: 0 auto;
    }
    .contact-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    .contact-field {
      border: 1px solid rgba(5,5,5,.2);
      padding: 13px 14px;
      margin-bottom: 14px;
      transition: border-color .15s ease;
    }
    .contact-field:focus-within {
      border-color: rgba(5,5,5,.6);
    }
    .contact-field input,
    .contact-field select,
    .contact-field textarea {
      display: block;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: var(--body);
      font-size: 14px;
      color: #050505;
      padding: 0;
    }
    .contact-field input::placeholder,
    .contact-field textarea::placeholder {
      color: rgba(5,5,5,.55);
    }
    .contact-field textarea {
      min-height: 140px;
      resize: vertical;
    }
    .contact-field select {
      cursor: pointer;
      color: rgba(5,5,5,.55);
    }
    .contact-field select.is-chosen {
      color: #050505;
    }
    .contact-submit-wrap {
      text-align: center;
      margin-top: 8px;
    }
    .contact-submit {
      display: inline-block;
      background: #050505;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 12px 44px;
      font-family: var(--body);
      font-size: 14px;
      cursor: pointer;
      transition: opacity .2s;
    }
    .contact-submit:hover { opacity: .85; }
    .contact-submit:disabled { opacity: .5; cursor: default; }
    .contact-msg {
      text-align: center;
      font-family: var(--util);
      font-size: 11px;
      letter-spacing: .08em;
      color: rgba(5,5,5,.5);
      margin-top: 14px;
    }

    @media (max-width: 640px) {
      .contact-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="paper pg">

  <header class="pg-header">
    <div class="pg-header-left">
      <a href="/shop/" class="pg-close" aria-label="Back to shop">×</a>
    </div>
    <a href="/" class="pg-brand" aria-label="LASTGAZE home">
      <img src="/brand/lastgaze-wordmark-black.svg" alt="LASTGAZE">
    </a>
    <div class="pg-header-right"></div>
  </header>

  <main class="pg-main">
    <h1 class="pg-h1">Get in touch</h1>
    <p class="pg-lead">Order help, sizing questions, press, or anything else — send it below and we'll get back to you.</p>

    <form class="contact-form" id="contact-form" novalidate>
      <div class="contact-row">
        <div class="contact-field">
          <label class="sr-only" for="contact-name">Name</label>
          <input type="text" id="contact-name" placeholder="Name *" required autocomplete="name">
        </div>
        <div class="contact-field">
          <label class="sr-only" for="contact-email">Email</label>
          <input type="email" id="contact-email" placeholder="Email *" required autocomplete="email">
        </div>
      </div>

      <div class="contact-field">
        <label class="sr-only" for="contact-subject">Subject</label>
        <select id="contact-subject">
          <option value="" selected>Subject</option>
          <option value="General enquiry">General enquiry</option>
          <option value="Order support">Order support</option>
          <option value="Sizing / fit">Sizing / fit</option>
          <option value="Press / collab">Press / collab</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="contact-field">
        <label class="sr-only" for="contact-message">Message</label>
        <textarea id="contact-message" placeholder="Please enter your message *" required></textarea>
      </div>

      <div class="contact-submit-wrap">
        <button class="contact-submit" type="submit">Submit</button>
      </div>
      <p class="contact-msg" id="contact-msg" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="/contact/contact.js"></script>
</body>
</html>
